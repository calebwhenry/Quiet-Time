name: Deploy to GitHub Pages
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - run: python3 -I tools/validate_plan.py plan/plan.json plan/inventory.json
      - run: npm run build
      - name: Guard against shipping secrets or Scripture
        run: |
          ! grep -rIl "service_role\|SERVICE_ROLE" dist/
          test $(du -sk dist | cut -f1) -lt 2000
      - name: Publish dist to gh-pages
        run: |
          cd dist && touch .nojekyll
          git init -q -b gh-pages && git add -A
          git -c user.name=github-actions -c user.email=actions@github.com commit -qm "Deploy ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
